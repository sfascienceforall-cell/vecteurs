<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;font-family:system-ui,-apple-system,sans-serif;}
canvas{display:block;border-radius:12px;border:1.5px solid #e8e8e8;touch-action:none;cursor:crosshair;}
.fml{font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:6px 0;font-family:ui-monospace,monospace;line-height:1.8;}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap;}
.pill{font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 14px;white-space:nowrap;}
.btn{padding:7px 15px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #d0d0d0;background:#fff;color:#2c2c2a;}
.btn.on{border-color:#185fa5;background:#e6f1fb;color:#185fa5;}
.btn.mode.on{border-color:#0F6E56;background:#e7f6ef;color:#0F6E56;}
.val{min-width:56px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:5px 10px;}
.info{font-size:12px;padding:8px 14px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#555;margin:6px 0;font-family:ui-monospace,monospace;line-height:1.7;}
input[type=range]{flex:1;min-width:100px;}
</style>

<canvas id="cv" style="width:100%;height:60vh;min-height:360px;"></canvas>
<div class="fml" id="fml"></div>

<div class="row">
  <button class="btn mode on" id="mSom" onclick="setMode('somme')">Somme ā+b̄</button>
  <button class="btn mode" id="mVec" onclick="setMode('vectoriel')">Produit vectoriel (3D)</button>
  <button class="btn mode" id="mSca" onclick="setMode('scalaire')">Produit scalaire</button>
</div>

<div class="row" id="rowSom">
  <button class="btn on" id="bC" onclick="showC=!showC;this.className=showC?'btn on':'btn';">Composantes</button>
  <button class="btn on" id="bT" onclick="showT=!showT;this.className=showT?'btn on':'btn';">Triangle</button>
  <button class="btn" id="bU" onclick="showU=!showU;this.className=showU?'btn on':'btn';">Unitaire 1̄ₑ</button>
  <button class="btn" id="bK" onclick="showK=!showK;this.className=showK?'btn on':'btn';">k·ā</button>
  <span class="pill" style="border-color:#f09595;color:#E24B4A;">k</span>
  <input type="range" id="k" min="-2" max="3" value="2" step="0.5" style="accent-color:#E24B4A;max-width:120px;">
  <span class="val" id="kv" style="border-color:#f09595;color:#E24B4A;">2</span>
</div>

<div class="row" id="rowVec" style="display:none;">
  <span class="pill" style="color:#0F6E56;border-color:#79c6a6;">🖱 glisse la pointe de ā ou b̄ pour la déplacer — glisse le fond pour tourner la vue</span>
</div>

<div class="row" id="rowSca" style="display:none;">
  <button class="btn on" id="bAnim" onclick="scalAnim=!scalAnim;this.className=scalAnim?'btn on':'btn';">Animer</button>
  <span class="pill">Angle θ</span>
  <input type="range" id="sth" min="0" max="360" value="55" step="1" style="accent-color:#378ADD;">
  <span class="val" id="sthv">55°</span>
</div>

<div class="info" id="info"></div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const RED='#E24B4A',BLUE='#378ADD',GREEN='#1D9E75',VIOLET='#7F77DD',ORANGE='#D85A30',GREY='#9aa0a6',AX='#c8ccd0';
let W=0,H=0,dpr=1,mode='somme';
let a={x:2.5,y:1.5}, b={x:1.5,y:-1.2};
let showC=true,showT=true,showU=false,showK=false,kk=2;
let ox=0,oy=0,unit=46;
let az=0.9, el=0.6, SC3=40, cx3=0, cy3=0;
let a3={x:2,y:0}, b3={x:1,y:1.7};
let scalAnim=true, sTheta=55, aS={x:3.2,y:0}, bLen=2.6;

document.getElementById('k').addEventListener('input',e=>{kk=parseFloat(e.target.value);document.getElementById('kv').textContent=kk;});
document.getElementById('sth').addEventListener('input',e=>{sTheta=+e.target.value;document.getElementById('sthv').textContent=sTheta+'°';scalAnim=false;document.getElementById('bAnim').className='btn';});

function setMode(m){mode=m;
  document.getElementById('mSom').className='btn mode'+(m==='somme'?' on':'');
  document.getElementById('mVec').className='btn mode'+(m==='vectoriel'?' on':'');
  document.getElementById('mSca').className='btn mode'+(m==='scalaire'?' on':'');
  document.getElementById('rowSom').style.display=m==='somme'?'flex':'none';
  document.getElementById('rowVec').style.display=m==='vectoriel'?'flex':'none';
  document.getElementById('rowSca').style.display=m==='scalaire'?'flex':'none';
  updateFml();
}
function updateFml(){const el2=document.getElementById('fml');
  if(mode==='somme') el2.innerHTML="<b style='color:#1D9E75'>c̄ = ā + b̄</b> | ‖ā‖=√(aₓ²+a_y²) | <b style='color:#7F77DD'>1̄ₑ=c̄/‖c̄‖</b> | glisse les pointes de <b style='color:#E24B4A'>ā</b>, <b style='color:#378ADD'>b̄</b>";
  else if(mode==='vectoriel') el2.innerHTML="<b style='color:#7F77DD'>c̄ = ā × b̄</b> ⟂ au plan (ā,b̄) | ‖ā×b̄‖ = ‖ā‖‖b̄‖·sinθ = aire du parallélogramme | main droite";
  else el2.innerHTML="<b style='color:#378ADD'>ā·b̄ = ‖ā‖‖b̄‖·cosθ</b> = ‖ā‖ × (projection de b̄ sur ā) | &gt;0 si aigu, &lt;0 si obtus";
}
function syncSize(){const r=cv.getBoundingClientRect();dpr=window.devicePixelRatio||1;
  const nW=Math.round(r.width)||700,nH=Math.round(r.height)||380;
  if(nW!==W||nH!==H){W=nW;H=nH;cv.width=W*dpr;cv.height=H*dpr;}
  ctx.setTransform(dpr,0,0,dpr,0,0);}

function arrow(x1,y1,x2,y2,col,lab,w,dash){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<1.5)return;
  ctx.strokeStyle=col;ctx.lineWidth=w||2.5;ctx.lineCap='round';
  if(dash)ctx.setLineDash(dash);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  const hs=(w||2.5)*3.2,ang=Math.atan2(dy,dx);
  ctx.fillStyle=col;ctx.save();ctx.translate(x2,y2);ctx.rotate(ang);
  ctx.beginPath();ctx.moveTo(hs,0);ctx.lineTo(-hs*0.7,-hs*0.55);ctx.lineTo(-hs*0.7,hs*0.55);ctx.closePath();ctx.fill();ctx.restore();
  if(lab){ctx.font='600 14px system-ui';ctx.textAlign='center';ctx.fillStyle=col;ctx.fillText(lab,x2+dx/len*15,y2+dy/len*15+5);}
}
// grille couvrant TOUT le canvas, étiquettes bornées à l'écran
function grid2D(){
  ctx.strokeStyle='#eceff1';ctx.lineWidth=1;
  const i0=Math.ceil((0-ox)/unit),i1=Math.floor((W-ox)/unit);
  for(let i=i0;i<=i1;i++){const gx=ox+i*unit;ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  const j0=Math.ceil((oy-H)/unit),j1=Math.floor((oy-0)/unit);
  for(let j=j0;j<=j1;j++){const gy=oy-j*unit;ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}
  ctx.strokeStyle=AX;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(W,oy);ctx.moveTo(ox,H);ctx.lineTo(ox,0);ctx.stroke();
  ctx.fillStyle=AX;
  ctx.beginPath();ctx.moveTo(W-1,oy);ctx.lineTo(W-9,oy-4);ctx.lineTo(W-9,oy+4);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(ox,1);ctx.lineTo(ox-4,9);ctx.lineTo(ox+4,9);ctx.closePath();ctx.fill();
  ctx.fillStyle=GREY;ctx.font='10px ui-monospace,monospace';ctx.textAlign='center';
  const ly=Math.min(Math.max(oy+13,12),H-3);
  for(let i=i0;i<=i1;i++){if(!i)continue;ctx.fillText(i,ox+i*unit,ly);}
  const lx=Math.min(Math.max(ox-12,10),W-12);
  for(let j=j0;j<=j1;j++){if(!j)continue;ctx.fillText(j,lx,oy-j*unit+3);}
}
const P=v=>({x:ox+v.x*unit,y:oy-v.y*unit});

function drawSomme(){
  ox=W*0.34;oy=H*0.60;unit=46;grid2D();
  const c={x:a.x+b.x,y:a.y+b.y};const pa=P(a),pb=P(b),pc=P(c);
  if(showC){ctx.strokeStyle=GREEN;ctx.setLineDash([4,4]);ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(pc.x,pc.y);ctx.lineTo(pc.x,oy);ctx.moveTo(pc.x,pc.y);ctx.lineTo(ox,pc.y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=GREEN;ctx.font='600 11px ui-monospace,monospace';ctx.textAlign='center';ctx.fillText('cₓ='+c.x.toFixed(1),pc.x,oy+(c.y>0?26:-16));
    ctx.textAlign=c.x>0?'right':'left';ctx.fillText('c_y='+c.y.toFixed(1),ox+(c.x>0?-8:8),pc.y+4);}
  if(showT){arrow(pa.x,pa.y,pa.x+b.x*unit,pa.y-b.y*unit,'#b5d4f4','b̄',2,[6,5]);
    arrow(pb.x,pb.y,pb.x+a.x*unit,pb.y-a.y*unit,'#f5c6c6','',1.5,[6,5]);}
  if(showK)arrow(ox,oy,ox+kk*a.x*unit,oy-kk*a.y*unit,'#a32d2d','k·ā',1.8,[2,4]);
  arrow(ox,oy,pa.x,pa.y,RED,'ā',3);arrow(ox,oy,pb.x,pb.y,BLUE,'b̄',3);arrow(ox,oy,pc.x,pc.y,GREEN,'c̄=ā+b̄',3.2);
  const nc=Math.hypot(c.x,c.y);
  if(showU&&nc>0.05)arrow(ox,oy,ox+c.x/nc*unit,oy-c.y/nc*unit,VIOLET,'1̄ₑ',4.5);
  [[pa,RED],[pb,BLUE]].forEach(([p,col])=>{ctx.fillStyle='#fff';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.stroke();});
  document.getElementById('info').innerHTML='<b style="color:'+RED+'">ā=('+a.x.toFixed(1)+';'+a.y.toFixed(1)+')</b> | <b style="color:'+BLUE+'">b̄=('+b.x.toFixed(1)+';'+b.y.toFixed(1)+')</b> | <b style="color:'+GREEN+'">c̄=('+c.x.toFixed(1)+';'+c.y.toFixed(1)+')</b> | ‖c̄‖='+nc.toFixed(2);
}

// ---- 3D ----
function pr3(x,y,z){const ca=Math.cos(az),sa=Math.sin(az);
  let X=x*ca-y*sa,Y=x*sa+y*ca;const ce=Math.cos(el),se=Math.sin(el);
  let Z2=Y*se+z*ce, Yx=Y*ce-z*se;return {x:cx3+X*SC3,y:cy3-Z2*SC3,d:Yx};}
function screenToPlane(sx,sy){const se=Math.sin(el);if(Math.abs(se)<1e-3)return null;
  const X=(sx-cx3)/SC3, Y=((cy3-sy)/SC3)/se;const ca=Math.cos(az),sa=Math.sin(az);
  return {x:X*ca+Y*sa, y:-X*sa+Y*ca};}
function arr3(p0,p1,col,lab,w){const A=pr3(p0[0],p0[1],p0[2]),B=pr3(p1[0],p1[1],p1[2]);arrow(A.x,A.y,B.x,B.y,col,lab,w||2.8);}
function drawVect(){
  cx3=W*0.5;cy3=H*0.56;SC3=Math.min(W,H)*0.072;const N=7;
  ctx.strokeStyle='#edeff2';ctx.lineWidth=1;
  for(let i=-N;i<=N;i++){let p1=pr3(i,-N,0),p2=pr3(i,N,0);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    let p3=pr3(-N,i,0),p4=pr3(N,i,0);ctx.beginPath();ctx.moveTo(p3.x,p3.y);ctx.lineTo(p4.x,p4.y);ctx.stroke();}
  [[[N,0,0],'x'],[[0,N,0],'y'],[[0,0,N],'z']].forEach(function(A){const o=pr3(0,0,0),e=pr3(A[0][0],A[0][1],A[0][2]);
    ctx.strokeStyle='#b8bcc2';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(e.x,e.y);ctx.stroke();
    ctx.fillStyle=GREY;ctx.font='600 12px system-ui';ctx.textAlign='center';ctx.fillText(A[1],e.x+(A[1]==='x'?10:0),e.y-6);
    for(let i=1;i<=N;i++){const tp=pr3(A[0][0]/N*i,A[0][1]/N*i,A[0][2]/N*i);ctx.fillStyle='#c8ccd0';ctx.beginPath();ctx.arc(tp.x,tp.y,1.5,0,7);ctx.fill();}});
  const av=[a3.x,a3.y,0], bv=[b3.x,b3.y,0];
  const q=[pr3(0,0,0),pr3(av[0],av[1],0),pr3(av[0]+bv[0],av[1]+bv[1],0),pr3(bv[0],bv[1],0)];
  ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);q.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.closePath();
  ctx.fillStyle='rgba(127,119,221,0.14)';ctx.fill();ctx.strokeStyle='rgba(127,119,221,0.5)';ctx.lineWidth=1.2;ctx.stroke();
  const cz=av[0]*bv[1]-av[1]*bv[0];
  arr3([0,0,0],av,RED,'ā',3);arr3([0,0,0],bv,BLUE,'b̄',3);arr3([0,0,0],[0,0,cz],VIOLET,'ā×b̄',3.2);
  // poignées
  [[av,RED],[bv,BLUE]].forEach(([vv,col])=>{const p=pr3(vv[0],vv[1],0);ctx.fillStyle='#fff';ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,6,0,7);ctx.fill();ctx.stroke();});
  const na=Math.hypot(a3.x,a3.y),nb=Math.hypot(b3.x,b3.y),sinth=Math.abs(cz)/((na*nb)||1);
  document.getElementById('info').innerHTML='‖ā‖='+na.toFixed(2)+' | ‖b̄‖='+nb.toFixed(2)+' | sinθ='+sinth.toFixed(2)+' | <b style="color:'+VIOLET+'">‖ā×b̄‖ = '+Math.abs(cz).toFixed(2)+'</b> = aire | direction '+(cz>=0?'+z':'−z')+' (main droite)';
}

function drawScal(){
  ox=W*0.26;oy=H*0.56;unit=46;grid2D();
  if(scalAnim){sTheta=(sTheta+0.5)%360;document.getElementById('sth').value=Math.round(sTheta);document.getElementById('sthv').textContent=Math.round(sTheta)+'°';}
  const th=sTheta*Math.PI/180, av=aS, bv={x:bLen*Math.cos(th),y:bLen*Math.sin(th)};
  const na=Math.hypot(av.x,av.y),ua={x:av.x/na,y:av.y/na},projS=bv.x*ua.x+bv.y*ua.y;
  const F={x:ox+projS*ua.x*unit,y:oy-projS*ua.y*unit},pB=P(bv);
  ctx.strokeStyle=GREY;ctx.setLineDash([4,4]);ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(pB.x,pB.y);ctx.lineTo(F.x,F.y);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=projS>=0?GREEN:RED;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(F.x,F.y);ctx.stroke();
  arrow(ox,oy,P(av).x,P(av).y,RED,'ā',3);arrow(ox,oy,pB.x,pB.y,BLUE,'b̄',3);
  ctx.fillStyle=projS>=0?GREEN:RED;ctx.beginPath();ctx.arc(F.x,F.y,4,0,7);ctx.fill();
  ctx.font='600 11px system-ui';ctx.textAlign='center';ctx.fillText('proj='+projS.toFixed(2),(ox+F.x)/2,oy+22);
  const dot=na*projS;
  document.getElementById('info').innerHTML='‖ā‖='+na.toFixed(2)+' | ‖b̄‖='+bLen.toFixed(2)+' | cosθ='+Math.cos(th).toFixed(2)+' | <b style="color:'+(dot>=0?BLUE:RED)+'">ā·b̄='+dot.toFixed(2)+'</b> '+(dot>=0?'(aigu)':'(obtus)');
}

function draw(){syncSize();ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  if(mode==='somme')drawSomme();else if(mode==='vectoriel')drawVect();else drawScal();
  requestAnimationFrame(draw);}

function getPos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
let drag=null,dragView=false,lastX=0,lastY=0;
function clampXY(o){o.x=Math.max(-7,Math.min(7,o.x));o.y=Math.max(-7,Math.min(7,o.y));return o;}
cv.addEventListener('pointerdown',e=>{const p=getPos(e);
  if(mode==='somme'){const pa=P(a),pb=P(b);if(Math.hypot(p.x-pa.x,p.y-pa.y)<18)drag=a;else if(Math.hypot(p.x-pb.x,p.y-pb.y)<18)drag=b;}
  else if(mode==='vectoriel'){const pA=pr3(a3.x,a3.y,0),pB=pr3(b3.x,b3.y,0);
    if(Math.hypot(p.x-pA.x,p.y-pA.y)<18)drag=a3;else if(Math.hypot(p.x-pB.x,p.y-pB.y)<18)drag=b3;else{dragView=true;lastX=p.x;lastY=p.y;cv.style.cursor='grabbing';}}
  else if(mode==='scalaire'){const th=sTheta*Math.PI/180,pB=P({x:bLen*Math.cos(th),y:bLen*Math.sin(th)});
    if(Math.hypot(p.x-pB.x,p.y-pB.y)<20){drag='b';scalAnim=false;document.getElementById('bAnim').className='btn';}}
});
cv.addEventListener('pointermove',e=>{const p=getPos(e);
  if(dragView){az+=(p.x-lastX)*0.008;el=Math.max(0.2,Math.min(1.3,el+(p.y-lastY)*0.008));lastX=p.x;lastY=p.y;return;}
  if(!drag)return;
  if(mode==='somme'){drag.x=Math.max(-8,Math.min(8,Math.round(((p.x-ox)/unit)*2)/2));drag.y=Math.max(-8,Math.min(8,Math.round(((oy-p.y)/unit)*2)/2));}
  else if(mode==='vectoriel'){const w=screenToPlane(p.x,p.y);if(w){drag.x=Math.round(w.x*2)/2;drag.y=Math.round(w.y*2)/2;clampXY(drag);}}
  else if(mode==='scalaire'&&drag==='b'){const vx=(p.x-ox)/unit,vy=(oy-p.y)/unit;bLen=Math.min(3.2,Math.max(0.5,Math.hypot(vx,vy)));
    let ang=Math.atan2(vy,vx)*180/Math.PI;if(ang<0)ang+=360;sTheta=ang;document.getElementById('sth').value=Math.round(ang);document.getElementById('sthv').textContent=Math.round(ang)+'°';}
});
window.addEventListener('pointerup',()=>{drag=null;dragView=false;cv.style.cursor='crosshair';});

setMode('somme');draw();
</script>
